<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>完美世界</title>
<style>
:root{
  --bg:#F6F7F9; --ink:#1B2230; --muted:#667085; --line:#E3E6EB; --accent:#2557E8; --chip:#E9EDF5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#12161D;--ink:#E8ECF3;--muted:#98A2B3;--line:#262D39;--accent:#7C9CFF;--chip:#1E2530}
}
:root[data-theme="dark"]{--bg:#12161D;--ink:#E8ECF3;--muted:#98A2B3;--line:#262D39;--accent:#7C9CFF;--chip:#1E2530}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:680px;margin:0 auto;padding:0 22px}

/* 宇宙背景个人简介 */
.hero{position:relative;overflow:hidden;color:#EAF0FF;
  background:
    radial-gradient(ellipse at 82% 18%,rgba(104,84,214,.5),transparent 55%),
    radial-gradient(ellipse at 8% 95%,rgba(32,120,210,.38),transparent 50%),
    linear-gradient(180deg,#060A18,#0D1533)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(transparent,var(--bg))}
.sky{position:absolute;inset:0;width:100%;height:100%}
.hero .wrap{position:relative;z-index:1;padding-top:28px;padding-bottom:84px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:48px;font-size:15px}
.top b{font-size:17px;letter-spacing:.06em}
.top nav{display:flex;gap:20px;opacity:.75}
.top nav a:hover{opacity:1}
.profile{display:flex;gap:20px;align-items:center}
.avatar{width:84px;height:84px;border-radius:50%;flex:none;background:#3B62F0;color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.22);
  display:grid;place-items:center;font-size:36px;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{margin:0;font-size:30px;line-height:1.25;letter-spacing:.02em}
.handle{margin:4px 0 0;opacity:.7;font-size:15px}
.intro{margin:22px 0 0;font-size:17px;max-width:30em}
.contact{margin:16px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px 22px;opacity:.78;font-size:15px}
.contact a,.contact button{color:inherit;font:inherit;background:none;border:0;padding:0;cursor:pointer}
.contact a:hover,.contact button:hover{opacity:1;text-decoration:underline}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.links a{padding:7px 16px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);border-radius:8px;font-size:15px;transition:background .15s}
.links a:hover{background:rgba(255,255,255,.16)}

/* 文章列表 */
.bar{display:flex;justify-content:space-between;align-items:center;padding:28px 0 0;font-size:15px}
.bar b{font-size:17px;letter-spacing:.06em}
.bar a:hover{color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 8px}
.chip{background:var(--chip);border-radius:999px;padding:3px 14px;font-size:14px;color:var(--muted);transition:.15s}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--accent);color:#fff}
.chip i{font-style:normal;opacity:.6;margin-left:4px;font-size:12px}
.year{margin:32px 0 4px;font-size:15px;color:var(--muted);font-weight:600}
.post{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:14px 0;border-bottom:1px solid var(--line)}
.post h2{margin:0;font-size:17px;font-weight:500;line-height:1.5}
.post:hover h2{color:var(--accent)}
.meta{flex:none;display:flex;gap:10px;align-items:baseline;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{background:var(--chip);border-radius:5px;padding:0 8px;font-size:13px}
.empty{padding:32px 0;color:var(--muted)}

/* 文章详情 */
.article{padding:40px 0 8px}
.article h1{font-size:28px;line-height:1.4}
.article .meta{margin-top:10px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.body{margin-top:26px;font-size:17px;line-height:1.95}
.body h2{font-size:21px;margin:34px 0 8px}
.body p{margin:0 0 18px}
.body pre{background:var(--chip);border-radius:8px;padding:14px 16px;overflow-x:auto;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:0 0 18px}
.body code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;background:var(--chip);padding:1px 6px;border-radius:4px}
.body pre code{background:none;padding:0}
.pn{display:flex;justify-content:space-between;gap:16px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line);font-size:15px}
.pn a{color:var(--muted);max-width:48%}
.pn a:hover{color:var(--accent)}
.pn a:last-child{text-align:right;margin-left:auto}

footer{margin:56px 0 0;padding-bottom:36px;color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}

.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,12,32,.7),rgba(6,12,32,.28)),linear-gradient(180deg,rgba(6,12,32,.2),rgba(6,12,32,.45))}
.hero .top,.hero h1,.hero .handle,.hero .intro,.hero .contact{text-shadow:0 1px 12px rgba(0,0,20,.55)}
.ph{position:relative;margin:0}
.ph img{display:block;width:100%;height:auto;border-radius:10px}
.cover{margin:22px 0 0}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:8px 0 14px}
.gallery .ph img{aspect-ratio:4/3;object-fit:cover}
.del{position:absolute;top:8px;right:8px;min-width:30px;height:30px;padding:0 10px;border:0;border-radius:15px;background:rgba(0,0,0,.62);color:#fff;font-size:15px;cursor:pointer}
.del.ask{background:#C7372F;font-size:13px}
.upl{position:relative;display:inline-block;padding:7px 16px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:15px;cursor:pointer;margin-top:4px}
.upl:hover{color:var(--accent);border-color:var(--accent)}
.upl input{position:absolute;opacity:0;width:1px;height:1px}
.upl:focus-within{outline:2px solid var(--accent);outline-offset:3px}
@media (max-width:560px){
  .wrap{padding:0 18px}
  .hero .wrap{padding-top:22px;padding-bottom:76px}
  .top{margin-bottom:36px}
  .profile{gap:16px}
  .avatar{width:68px;height:68px;font-size:28px}
  h1{font-size:25px}
  .intro{font-size:16px}
  .post{flex-direction:column;gap:2px}
  .meta{order:-1;font-size:13px}
  .article h1{font-size:24px}
  .article .meta{order:0}
  .body{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function footer(){return '<footer><span>© 2026 完美世界</span><span>用文字记录技术</span></footer>'}

function home(tag){
  var counts={},order=[];
  posts.forEach(function(p){p.tags.forEach(function(t){if(!counts[t]){counts[t]=0;order.push(t)}counts[t]++})});
  var h='<div class="tags" style="margin-top:28px">'+
    '<a class="chip'+(tag?'':' on')+'" href="#/">全部<i>'+posts.length+'</i></a>'+
    order.map(function(t){return '<a class="chip'+(t===tag?' on':'')+'" href="#/tag/'+encodeURIComponent(t)+'">'+esc(t)+'<i>'+counts[t]+'</i></a>'}).join('')+'</div>';
  var list=posts.filter(function(p){return !tag||p.tags.indexOf(tag)>-1});
  if(!list.length)h+='<p class="empty">没有找到「'+esc(tag)+'」下的文章，试试其他标签。</p>';
  var y='';
  list.forEach(function(p){
    var py=p.date.slice(0,4);
    if(py!==y){y=py;h+='<h3 class="year">'+py+'</h3>'}
    h+='<a class="post" href="#/post/'+p.id+'"><h2>'+esc(p.title)+'</h2><span class="meta"><time datetime="'+p.date+'">'+p.date.slice(5)+'</time>'+
       p.tags.map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('')+'</span></a>';
  });
  return h+footer();
}

var art=null,curId=0,arm=null;
var state=JSON.parse(document.getElementById('state').textContent||'{}');state.photos=state.photos||{};
function say(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(say.k);say.k=setTimeout(function(){t.classList.remove('on')},2000)}
function photosOf(id){return state.photos[id]||[]}
function fig(src,i,cls){return '<figure class="ph '+cls+'"><img src="'+src+'" alt="文章配图" loading="lazy">'+(art?'<button type="button" class="del" data-del="'+i+'" aria-label="删除照片">×</button>':'')+'</figure>'}

function detail(id){
  curId=id;
  var i=posts.findIndex(function(p){return p.id===id});
  if(i<0)return '<div class="bar"><a href="#/"><b>完美世界</b></a></div><p class="empty">没有找到这篇文章。<a href="#/" style="color:var(--accent)">返回文章列表</a></p>'+footer();
  var p=posts[i],newer=posts[i-1],older=posts[i+1],ph=photosOf(id);
  var rest=ph.slice(1).map(function(s,k){return fig(s,k+1,'')}).join('');
  return '<div class="bar"><a href="#/"><b>完美世界</b></a><a href="#/">返回文章列表</a></div>'+
    '<article class="article"><h1>'+esc(p.title)+'</h1><div class="meta"><time datetime="'+p.date+'">'+p.date+'</time>'+
    p.tags.map(function(t){return '<a class="tag" href="#/tag/'+encodeURIComponent(t)+'">'+esc(t)+'</a>'}).join('')+'</div>'+
    (ph[0]?fig(ph[0],0,'cover'):'')+
    '<div class="body">'+p.body+'</div>'+
    (rest?'<div class="gallery">'+rest+'</div>':'')+
    (art?'<label class="upl">添加照片<input type="file" accept="image/*" multiple></label>':'')+
    '<nav class="pn">'+(newer?'<a href="#/post/'+newer.id+'">上一篇：'+esc(newer.title)+'</a>':'<span></span>')+
    (older?'<a href="#/post/'+older.id+'">下一篇：'+esc(older.title)+'</a>':'')+'</nav></article>'+footer();
}
function refresh(){if(!hero.hidden&&curId){view.innerHTML=detail(curId)}}

// 生成可发布的干净页面（照片以数据形式写进页面）
function buildHtml(){
  var c=document.documentElement.cloneNode(true);
  c.querySelector('#view').innerHTML='';
  c.querySelector('#hero').removeAttribute('hidden');
  var t=c.querySelector('#toast');t.className='toast';t.textContent='';
  c.querySelector('#state').textContent=JSON.stringify(state).replace(/</g,'\u003c');
  return '<!DOCTYPE html>\n'+c.outerHTML;
}
function save(prev){
  return art.publish(buildHtml()).catch(function(e){
    state.photos=prev;var c=e&&e.code;
    if(c==='not_writer'||c==='not_granted'){art=null;refresh();say('只有页面作者可以修改照片')}
    else{refresh();if(c!=='conflict')say('保存失败，请稍后重试')}
  });
}
function shrink(f){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
  var s=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82))};
  im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(f)})}
function copyPhotos(){return JSON.parse(JSON.stringify(state.photos))}

view.addEventListener('change',function(e){
  if(!e.target.matches('input[type=file]')||!art)return;
  var fs=[].slice.call(e.target.files).filter(function(f){return /^image\//.test(f.type)});e.target.value='';
  if(!fs.length)return;
  say('正在处理照片…');var prev=copyPhotos(),id=curId;
  Promise.all(fs.map(shrink)).then(function(urls){
    state.photos[id]=photosOf(id).concat(urls);
    if(JSON.stringify(state).length>12e6){state.photos=prev;say('照片总量过大，请先删除一些');return}
    refresh();return save(prev).then(function(){say('已保存')});
  },function(){say('图片读取失败')});
});
view.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-del]');if(!b||!art)return;
  if(arm!==b.getAttribute('data-del')){arm=b.getAttribute('data-del');b.classList.add('ask');b.textContent='确认删除';return}
  var prev=copyPhotos(),arr=photosOf(curId).slice();arr.splice(+arm,1);arm=null;
  state.photos[curId]=arr;refresh();save(prev);
});

function route(){
  var h=decodeURIComponent(location.hash.replace(/^#\/?/,'')),m;
  if(m=h.match(/^post\/(\d+)$/)){hero.hidden=true;view.innerHTML=detail(+m[1]);window.scrollTo(0,0)}
  else{
    hero.hidden=false;
    view.innerHTML=home((m=h.match(/^tag\/(.+)$/))?m[1]:'');
    if(h==='about')window.scrollTo(0,0);
    else if(m){var t=view.querySelector('.tags');t&&t.scrollIntoView({block:'start'})}
    else window.scrollTo(0,0);
  }
}
window.addEventListener('hashchange',route);route();
if(window.claude&&claude.use){claude.use('artifact').then(function(a){if(a){art=a;refresh()}},function(){})}


// 点击微信号复制
var toast=document.getElementById("toast");
document.getElementById("wx").addEventListener("click",function(){
  var t=this.getAttribute("data-copy");
  function done(m){toast.textContent=m;toast.classList.add("on");setTimeout(function(){toast.classList.remove("on")},1600)}
  try{navigator.clipboard.writeText(t).then(function(){done("微信号已复制")},function(){done("请手动复制："+t)})}
  catch(e){done("请手动复制："+t)}
});
</script>
</body>
